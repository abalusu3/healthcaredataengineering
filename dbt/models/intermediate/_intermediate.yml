version: 2

models:
  - name: int_admission_charlson
    description: Charlson Comorbidity Index from conditions active on the admit date.
    columns:
      - name: admission_id
        data_tests: [unique, not_null]
      - name: charlson_score
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 30}

  - name: int_admission_ed_use
    columns:
      - name: admission_id
        data_tests: [unique, not_null]

  - name: int_admission_lace
    columns:
      - name: admission_id
        data_tests: [unique, not_null]
