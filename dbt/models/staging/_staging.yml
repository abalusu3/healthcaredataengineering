version: 2

models:
  - name: stg_members
    description: One row per synthetic member (direct identifiers already removed in silver).
    columns:
      - name: member_id
        data_tests: [unique, not_null]
      - name: birth_date
        data_tests: [not_null]

  - name: stg_encounters
    columns:
      - name: encounter_id
        data_tests: [unique, not_null]
      - name: member_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_members')
                field: member_id
      - name: encounter_class
        data_tests:
          - accepted_values:
              arguments:
                values: [ambulatory, wellness, outpatient, urgentcare, emergency, inpatient,
                         home, virtual, snf, hospice]

  - name: stg_payers
    columns:
      - name: payer_id
        data_tests: [unique, not_null]
      - name: payer_type
        data_tests:
          - accepted_values:
              arguments:
                values: [Medicare, Medicaid, Dual, Uninsured, Commercial]

  - name: stg_organizations
    columns:
      - name: organization_id
        data_tests: [unique, not_null]

  - name: stg_hospital_xref
    columns:
      - name: organization_id
        data_tests: [unique, not_null]
      - name: match_tier
        data_tests:
          - accepted_values:
              arguments:
                values: [exact, probable, unmatched]

  - name: stg_cms_hospitals
    columns:
      - name: ccn
        data_tests: [unique, not_null]
      - name: overall_rating
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
              config:
                where: overall_rating is not null

  - name: stg_svi_county
    columns:
      - name: county_fips
        data_tests: [unique, not_null]

  - name: stg_admissions
    description: One row per admission episode with Spark-computed readmission flags.
    columns:
      - name: admission_id
        data_tests: [unique, not_null]
      - name: member_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_members')
                field: member_id
      - name: days_to_readmit
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 30
              config:
                where: readmit_30d
